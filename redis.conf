# Redis Configuration File

# Bind to all interfaces to allow access from Docker network
bind 0.0.0.0

# Protected mode - set to no if you want to allow connections from other containers
protected-mode no

# Port
port 6379

# Persistence
save 900 1
save 300 10
save 60 10000

# Append Only File (AOF)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice
logfile ""

# Database
databases 16

